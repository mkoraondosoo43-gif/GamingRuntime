plugins {
    id "com.android.application"
}

android {
    namespace "com.gamingruntime.host"
    compileSdk 35

    defaultConfig {
        applicationId "com.gamingruntime.host"
        minSdk 24
        targetSdk 35
        versionCode 26
        versionName "2.5.1"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    ndkVersion "27.2.12479018"

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.22.1"
        }
    }
}
